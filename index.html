<meta name="theme-color" content="#FFC300">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FFC300'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='24' text-anchor='middle' fill='%231E1A0E'%3ERTU%3C/text%3E%3C/svg%3E">

<style>
/* Base for the standalone careers page (the glass theme follows in careers.css) */
:root{--f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root{color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:84px}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.7;min-height:100vh}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cv-link);outline-offset:2px}
[hidden]{display:none!important}
.led{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.hint{font-size:13px;color:var(--cv-muted)}
.mono{font-family:var(--f-mono)!important;font-size:13.5px}
.sel{user-select:all}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,var(--cv-glass-a),var(--cv-glass-b));-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);border-bottom:1px solid var(--cv-edge-low);box-shadow:inset 0 -1px 0 var(--cv-edge-low)}
#hdr .bar{display:flex;align-items:center;gap:8px;min-height:62px}
#hdr .sp{flex:1}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em}
.brand small{font-size:11px;color:var(--cv-muted);letter-spacing:.06em;font-weight:500}
@media (max-width:480px){.brand small,.hide-sm{display:none}}
#ftr{padding-block:28px;color:var(--cv-muted);font-size:13px;text-align:center}
.cv-general{margin-top:14px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.cv-general h4{font-size:16px}
.cv-general p{font-size:14px;color:var(--cv-muted)}
.cv-done h2{font-size:clamp(26px,4vw,40px);margin-top:16px}
.cv-done .cv-sub{margin-inline:auto;margin-top:8px}
.cv-cta.center{justify-content:center}
.cv-done{display:flex;flex-direction:column;align-items:center}
/* in dark mode the yellow marker would sit under light text, so the phrase turns yellow instead */
@media (prefers-color-scheme: dark){body .cv-hero h1 .hl{background:none;color:var(--cv-accent);padding:0}}

/* RTU Careers — yellow "liquid glass": translucent, light-bending panels floating over slow yellow light.
   Scoped to body[data-page="careers"]; the rest of the site keeps its own palette. */
body[data-page="careers"]{
  --cv-canvas:#FFF3C4; --cv-blob1:#FFD60A; --cv-blob2:#FFB703; --cv-blob3:#FFF27A; --cv-blob4:#FFFFFF;
  --cv-ink:#1E1A0E; --cv-muted:#5E5333; --cv-link:#8A5A00;
  --cv-accent:#FFC300; --cv-accent-ink:#1E1A0E; --cv-btn-a:#FFE680; --cv-btn-b:#FFC300;
  --cv-glass-a:rgba(255,255,255,.62); --cv-glass-b:rgba(255,255,255,.2);
  --cv-edge:rgba(255,255,255,.85); --cv-edge-low:rgba(255,255,255,.28); --cv-sheen:rgba(255,255,255,.6);
  --cv-shadow:rgba(122,84,0,.22); --cv-field:rgba(255,255,255,.55); --cv-field-line:rgba(120,90,10,.2);
  --cv-ok:#0E7A4F; --cv-err:#B3261E;
  /* map site tokens so shared header, modal and toast fit the page */
  --ink:var(--cv-ink); --muted:var(--cv-muted); --accent:var(--cv-link); --accent-ink:#fff; --accent-soft:rgba(255,195,0,.25);
  --line:var(--cv-field-line); --bg:var(--cv-field); --sunk:rgba(255,255,255,.35); --surface:#FFFBEA; --danger:var(--cv-err);
  background:var(--cv-canvas); color:var(--cv-ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-page="careers"]{
  --cv-canvas:#110E05; --cv-blob1:#7A5C00; --cv-blob2:#8F6400; --cv-blob3:#4A3B00; --cv-blob4:#2B2410;
  --cv-ink:#FFF7DB; --cv-muted:#CDBF93; --cv-link:#FFD23F;
  --cv-accent:#FFD23F; --cv-accent-ink:#1E1A0E; --cv-btn-a:#FFE27A; --cv-btn-b:#F5B800;
  --cv-glass-a:rgba(70,58,22,.5); --cv-glass-b:rgba(28,23,9,.32);
  --cv-edge:rgba(255,236,170,.34); --cv-edge-low:rgba(255,236,170,.08); --cv-sheen:rgba(255,240,190,.1);
  --cv-shadow:rgba(0,0,0,.5); --cv-field:rgba(0,0,0,.28); --cv-field-line:rgba(255,230,150,.2);
  --cv-ok:#5BD69D; --cv-err:#FF8A80;
  --accent-ink:#1E1A0E; --surface:#1E190B; --sunk:rgba(255,236,170,.06)}}
:root[data-theme="dark"] body[data-page="careers"]{
  --cv-canvas:#110E05; --cv-blob1:#7A5C00; --cv-blob2:#8F6400; --cv-blob3:#4A3B00; --cv-blob4:#2B2410;
  --cv-ink:#FFF7DB; --cv-muted:#CDBF93; --cv-link:#FFD23F;
  --cv-accent:#FFD23F; --cv-accent-ink:#1E1A0E; --cv-btn-a:#FFE27A; --cv-btn-b:#F5B800;
  --cv-glass-a:rgba(70,58,22,.5); --cv-glass-b:rgba(28,23,9,.32);
  --cv-edge:rgba(255,236,170,.34); --cv-edge-low:rgba(255,236,170,.08); --cv-sheen:rgba(255,240,190,.1);
  --cv-shadow:rgba(0,0,0,.5); --cv-field:rgba(0,0,0,.28); --cv-field-line:rgba(255,230,150,.2);
  --cv-ok:#5BD69D; --cv-err:#FF8A80;
  --accent-ink:#1E1A0E; --surface:#1E190B; --sunk:rgba(255,236,170,.06)}


/* moving light behind the glass */
.cv-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--cv-canvas)}
.cv-bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.85;will-change:transform}
.cv-bg i:nth-child(1){width:52vmax;height:52vmax;background:var(--cv-blob1);top:-18vmax;inset-inline-start:-12vmax;animation:cvA 26s ease-in-out infinite alternate}
.cv-bg i:nth-child(2){width:40vmax;height:40vmax;background:var(--cv-blob2);bottom:-16vmax;inset-inline-end:-10vmax;animation:cvB 30s ease-in-out infinite alternate}
.cv-bg i:nth-child(3){width:34vmax;height:34vmax;background:var(--cv-blob3);top:30%;inset-inline-start:38%;animation:cvC 22s ease-in-out infinite alternate}
.cv-bg i:nth-child(4){width:26vmax;height:26vmax;background:var(--cv-blob4);top:8%;inset-inline-end:12%;opacity:.7;animation:cvB 34s ease-in-out infinite alternate-reverse}
@keyframes cvA{to{transform:translate(14vmax,10vmax) scale(1.08)}}
@keyframes cvB{to{transform:translate(-12vmax,-8vmax) scale(.92)}}
@keyframes cvC{to{transform:translate(-10vmax,12vmax) scale(1.12)}}

/* glass header */
body[data-page="careers"] .topbar{background:linear-gradient(180deg,var(--cv-glass-a),var(--cv-glass-b));-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);border-bottom:1px solid var(--cv-edge-low);box-shadow:inset 0 -1px 0 var(--cv-edge-low)}
body[data-page="careers"] .nav a:hover,body[data-page="careers"] .nav a.active{background:var(--cv-glass-a)}
body[data-page="careers"] .led{background:var(--cv-accent);box-shadow:0 0 0 3px rgba(255,195,0,.3)}
body[data-page="careers"] .btn.primary{background:linear-gradient(180deg,var(--cv-btn-a),var(--cv-btn-b));border-color:transparent;color:var(--cv-accent-ink)}
body[data-page="careers"] footer.site{background:transparent;border-top:1px solid var(--cv-edge-low)}

/* the glass material */
.g{position:relative;isolation:isolate;border-radius:30px;background:linear-gradient(145deg,var(--cv-glass-a),var(--cv-glass-b));
  -webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);
  box-shadow:inset 0 1px 0 var(--cv-edge),inset 0 -1px 0 var(--cv-edge-low),inset 0 0 24px var(--cv-edge-low),0 22px 50px -18px var(--cv-shadow)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:linear-gradient(155deg,var(--cv-edge),transparent 32%,transparent 68%,var(--cv-edge-low));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(90% 70% at var(--mx,20%) var(--my,0%),var(--cv-sheen),transparent 62%);transition:background-position .2s}
.g.sm{border-radius:20px}

.cv{color:var(--cv-ink)}
.cv a{color:var(--cv-link)}
.cv-wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cv-sec{padding-block:28px}
.cv-eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.06em;padding:6px 14px;border-radius:999px}
.cv-eyebrow .led{width:8px;height:8px}

.cv-hero{padding-block:44px 20px}
.cv-hero-card{padding:clamp(24px,5vw,56px);display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:end}
@media (max-width:860px){.cv-hero-card{grid-template-columns:1fr}}
.cv-hero h1{font-size:clamp(36px,6vw,68px);font-weight:700;letter-spacing:-.015em;line-height:1.12;margin-top:16px}
.cv-hero h1 .hl{background:linear-gradient(180deg,transparent 58%,var(--cv-accent) 58%,var(--cv-accent) 92%,transparent 92%);padding-inline:4px}
.cv-hero .lede{font-size:18px;color:var(--cv-muted);margin-top:16px;max-width:56ch}
.cv-facts{display:grid;gap:10px}
.cv-fact{padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.cv-fact span{color:var(--cv-muted);font-size:14px}
.cv-fact b{font-family:var(--f-display);font-size:16px;text-align:end}
.cv-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;border:0;cursor:pointer;font-weight:600;font-size:15px;color:var(--cv-ink);text-decoration:none;white-space:nowrap;position:relative;isolation:isolate;
  background:linear-gradient(145deg,var(--cv-glass-a),var(--cv-glass-b));-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);
  box-shadow:inset 0 1px 0 var(--cv-edge),inset 0 0 0 1px var(--cv-edge-low),0 8px 20px -10px var(--cv-shadow);transition:transform .15s}
.gbtn:hover{transform:translateY(-1px)}
.gbtn:active{transform:translateY(1px) scale(.99)}
.gbtn.primary{background:linear-gradient(180deg,var(--cv-btn-a),var(--cv-btn-b));color:var(--cv-accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -2px 6px rgba(150,95,0,.25),0 10px 24px -10px rgba(190,130,0,.6)}
.gbtn.sm{padding:7px 14px;font-size:13.5px}
.gbtn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

.cv-h2{font-size:clamp(24px,3.2vw,34px);margin-bottom:6px}
.cv-sub{color:var(--cv-muted);font-size:16px;max-width:62ch}
.cv-steps-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:820px){.cv-steps-row{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.cv-steps-row{grid-template-columns:1fr}}
.cv-step{padding:18px}
.cv-step .n{font-family:var(--f-mono);font-size:13px;color:var(--cv-link)}
.cv-step h3{font-size:17px;margin:4px 0}
.cv-step p{font-size:14px;color:var(--cv-muted)}

.cv-group{margin-top:22px}
.cv-group h3{font-size:15px;color:var(--cv-muted);font-family:var(--f-display);margin-bottom:10px;letter-spacing:.04em}
.cv-roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cv-role{padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cv-role h4{font-size:17px}
.cv-role p{font-size:14px;color:var(--cv-muted);flex:1}
.cv-role .gbtn{align-self:flex-start}

/* application */
.cv-app{padding:clamp(18px,3.5vw,36px)}
.cv-prog{display:flex;gap:6px;overflow-x:auto;padding:6px;border-radius:999px;margin-bottom:22px;scrollbar-width:none}
.cv-prog::-webkit-scrollbar{display:none}
.cv-prog button{flex:1 0 auto;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--cv-muted);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.cv-prog button .n{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;background:var(--cv-field);box-shadow:inset 0 0 0 1px var(--cv-field-line)}
.cv-prog button.done{color:var(--cv-ink)}
.cv-prog button.done .n{background:var(--cv-ink);color:var(--cv-canvas);box-shadow:none}
.cv-prog button.cur{background:linear-gradient(180deg,var(--cv-btn-a),var(--cv-btn-b));color:var(--cv-accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.cv-prog button.cur .n{background:rgba(255,255,255,.6);color:var(--cv-accent-ink);box-shadow:none}
.cv-prog button[disabled]{cursor:default}
.cv-prog .bar{display:none}
@media (max-width:640px){.cv-prog button:not(.cur) .t{display:none}}
.cv-step-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.cv-step-head h2{font-size:clamp(22px,3vw,30px)}
.cv-step-head p{color:var(--cv-muted)}
.cv-saved{font-size:12.5px;color:var(--cv-muted);font-family:var(--f-mono)}

.cv-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
@media (max-width:640px){.cv-grid{grid-template-columns:1fr}}
.cvf{display:flex;flex-direction:column;gap:7px;min-width:0}
.cvf.full{grid-column:1/-1}
.cvf > label,.cvf .q{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.5}
.cvf .q .req,.cvf > label .req{color:var(--cv-err);margin-inline-start:3px}
.cvf .hint{font-size:13px;color:var(--cv-muted)}
.cvf input:not([type=checkbox]):not([type=radio]):not([type=file]),.cvf select,.cvf textarea{width:100%;background:var(--cv-field);border:1px solid var(--cv-field-line);border-radius:14px;padding:11px 14px;color:var(--cv-ink);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.cvf textarea{min-height:110px;resize:vertical;line-height:1.7}
.cvf input:focus,.cvf select:focus,.cvf textarea:focus{outline:none;border-color:var(--cv-accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--cv-accent) 35%,transparent)}
.cvf.bad input,.cvf.bad select,.cvf.bad textarea,.cvf.bad .cv-seg,.cvf.bad .cv-chips{border-color:var(--cv-err);box-shadow:0 0 0 3px color-mix(in srgb,var(--cv-err) 22%,transparent)}
.cvf .msg{font-size:13px;color:var(--cv-err);min-height:0}
.cvf .cnt{font-size:12px;color:var(--cv-muted);font-family:var(--f-mono);align-self:flex-end}
.cvf .cnt.ok{color:var(--cv-ok)}
.cv-seg{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:16px;background:var(--cv-field);border:1px solid var(--cv-field-line)}
.cv-seg button{flex:1 1 auto;border:0;background:transparent;padding:8px 12px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--cv-muted);font-size:14px}
.cv-seg button.on{background:linear-gradient(180deg,var(--cv-btn-a),var(--cv-btn-b));color:var(--cv-accent-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 10px -6px rgba(150,95,0,.6)}
.cv-chips{display:flex;flex-wrap:wrap;gap:8px;border-radius:16px;border:1px solid transparent;padding:2px}
.cv-chips label{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--cv-field);border:1px solid var(--cv-field-line);font-size:13.5px;font-weight:500;cursor:pointer}
.cv-chips label:has(input:checked){background:var(--cv-ink);color:var(--cv-canvas);border-color:var(--cv-ink)}
.cv-chips input{accent-color:var(--cv-accent);margin:0}
.cv-rate{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cv-rate button{width:40px;height:40px;border-radius:12px;border:1px solid var(--cv-field-line);background:var(--cv-field);cursor:pointer;font-family:var(--f-mono);font-weight:600;color:var(--cv-muted)}
.cv-rate button.on{background:linear-gradient(180deg,var(--cv-btn-a),var(--cv-btn-b));color:var(--cv-accent-ink);border-color:transparent}
.cv-rate .lbl{font-size:12.5px;color:var(--cv-muted);margin-inline-start:6px}
.cv-rate-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--cv-field-line)}
@media (max-width:560px){.cv-rate-row{grid-template-columns:1fr}}
.cv-consent{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--cv-field);border:1px solid var(--cv-field-line);font-weight:500;cursor:pointer}
.cv-consent input{margin-top:6px;accent-color:var(--cv-accent);width:18px;height:18px;flex:none}
.cv-file{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:14px;border:1.5px dashed var(--cv-field-line);background:var(--cv-field)}
.cv-subhead{grid-column:1/-1;font-size:15px;font-family:var(--f-display);padding-top:10px;margin-top:4px;border-top:1px solid var(--cv-field-line);color:var(--cv-muted);letter-spacing:.03em}
.cv-nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.cv-err-box{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--cv-err) 14%,transparent);color:var(--cv-err);font-weight:500}
.cv-review{display:grid;gap:14px}
.cv-review section{padding:16px 18px}
.cv-review h3{font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.cv-review dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:6px 16px;font-size:14px}
@media (max-width:600px){.cv-review dl{grid-template-columns:1fr}.cv-review dd{margin-bottom:8px}}
.cv-review dt{color:var(--cv-muted)}
.cv-review dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.cv-done{text-align:center;padding:clamp(28px,6vw,64px)}
.cv-done .ref{display:inline-block;font-family:var(--f-mono);font-size:22px;padding:10px 20px;border-radius:16px;margin:16px 0;user-select:all}
.cv-closed{padding:22px;text-align:center;color:var(--cv-muted)}
@media (prefers-reduced-motion:reduce){.cv-bg i{animation:none}}

</style>
</head>
<body data-page="careers">
<div class="cv-bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  }
  const i = S.step, s = CV_STEPS[i], fields = cvStepFields(i, S.a), last = i === CV_STEPS.length - 1;
  host.innerHTML = `<nav class="cv-prog g sm" aria-label="${L('خطوات التقديم', 'Application steps')}">${CV_STEPS.map((x, j) => `<button type="button" data-go="${j}" class="${j === i ? 'cur' : j <= S.max ? 'done' : ''}" ${j > S.max ? 'disabled' : ''} ${j === i ? 'aria-current="step"' : ''}><span class="n">${j + 1}</span><span class="t">${esc(L(x.ar, x.en))}</span></button>`).join('')}</nav>
    <div class="cv-step-head"><div><p class="cv-saved">${L('الخطوة', 'Step')} ${fmtNum(i + 1)} ${t('of')} ${fmtNum(CV_STEPS.length)}</p><h2>${esc(L(s.ar, s.en))}</h2><p>${esc(L(s.dAr, s.dEn))}</p></div><span class="cv-saved" id="cvSaved"></span></div>
    ${last ? reviewHTML() : `<div class="cv-grid">${fields.map(field).join('')}</div>`}
    <div class="hp" aria-hidden="true"><label>Website <input id="cv_website" tabindex="-1" autocomplete="off"></label></div>
    <div class="cv-err-box" id="cvErr" role="alert" hidden></div>
    <div class="cv-nav">${i > 0 ? `<button type="button" class="gbtn" id="cvBack">${t('prev')}</button>` : '<span></span>'}${last ? `<button type="button" class="gbtn primary" id="cvSend">${L('إرسال الطلب', 'Submit application')}</button>` : `<button type="button" class="gbtn primary" id="cvNext">${t('next')}</button>`}</div>`;
  bind(host, fields);
}
function reviewHTML() {
  return `<div class="cv-review">${CV_STEPS.slice(0, -1).map((s, i) => `<section class="g sm"><h3>${esc(L(s.ar, s.en))}<button type="button" class="gbtn sm" data-go="${i}">${t('edit')}</button></h3><dl>${cvStepFields(i, S.a).filter(f => f.t !== 'subhead' && f.t !== 'consent' && (!f.show || f.show(S.a)) && f.ar.trim()).map(f => `<dt>${esc(L(f.ar, f.en))}</dt><dd>${esc(f.t === 'file' ? (S.cv ? S.cv.name : '—') : cvValueText(f, S.a[f.id]))}</dd>`).join('')}</dl></section>`).join('')}</div>`;
}
function bind(host, fields) {
  const a = S.a, set = (k, v) => { a[k] = v; saveDraft(); const w = $(`[data-wrap="${k}"]`); if (w && w.classList.contains('bad')) { w.classList.remove('bad'); const m = $(`[data-msg="${k}"]`); if (m) m.textContent = ''; } };
  $$('[data-f]', host).forEach(el => { const k = el.dataset.f; el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { set(k, el.value);
    const f = fields.find(x => x.id === k), c = $(`[data-cnt="${k}"]`); if (c && f) { const n = el.value.trim().length; c.textContent = fmtNum(n) + ' / ' + fmtNum(f.min) + '+'; c.classList.toggle('ok', n >= f.min); }
    if (k === 'source') renderApp(); }); });
  $$('[data-seg]', host).forEach(g => g.onclick = e => { const b = e.target.closest('button'); if (!b) return; set(g.dataset.seg, b.dataset.v); $$('button', g).forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); }); });
  $$('[data-rate]', host).forEach(g => g.onclick = e => { const b = e.target.closest('button'); if (!b) return; set(g.dataset.rate, +b.dataset.v); $$('button', g).forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); }); });
  $$('[data-checks]', host).forEach(g => g.onchange = () => set(g.dataset.checks, $$('input:checked', g).map(i => i.value)));
  $$('[data-consent]', host).forEach(c => c.onchange = () => set(c.dataset.consent, c.checked));
  $$('[data-file]', host).forEach(inp => inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 3 * 1048576) { showErrors([['cv', L('الملف أكبر من ٣ ميجا', 'The file is larger than 3 MB')]]); inp.value = ''; return; }
    const r = new FileReader(); r.onload = () => { S.cv = { name: f.name, size: f.size, type: f.type, data: String(r.result).split(',')[1] }; set('cv', { name: f.name, size: f.size }); renderApp(); }; r.readAsDataURL(f);
  });
  $$('[data-rmfile]', host).forEach(b => b.onclick = () => { S.cv = null; set('cv', null); renderApp(); });
  $$('[data-go]', host).forEach(b => b.onclick = () => { S.step = +b.dataset.go; saveDraft(); renderApp(); toTop(); });
  const back = $('#cvBack'); if (back) back.onclick = () => { S.step--; saveDraft(); renderApp(); toTop(); };
  const next = $('#cvNext'); if (next) next.onclick = () => { const errs = validate(fields); if (errs.length) { showErrors(errs); return; } S.step++; S.max = Math.max(S.max, S.step); saveDraft(); renderApp(); toTop(); };
  const send = $('#cvSend'); if (send) send.onclick = () => submit(send);
}
const toTop = () => { const el = $('#apply'); if (el) el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); };

async function submit(btn) {
  for (let i = 0; i < CV_STEPS.length - 1; i++) { const errs = validate(cvStepFields(i, S.a)); if (errs.length) { S.step = i; renderApp(); showErrors(errs); return; } }
  if (!SHEET_URL) { showErrors([], L('الصفحة لسه مش متوصلة بشيت الطلبات. بلّغ الشركة.', 'This page is not connected to the applications sheet yet. Please tell the company.')); return; }
  const a = S.a, fields = cvAllFields(a).filter(f => f.t !== 'file' && (!f.show || f.show(a)));
  const values = {}, columns = [];
  for (const f of fields) { const h = HEAD[f.id] || f.id; columns.push(h); values[h] = f.t === 'rate' ? (+a[f.id] || '') : (f.t === 'number' && a[f.id] ? +a[f.id] : arText(f, a[f.id]).replace(/^—$/, '')); }
  const payload = { website: ($('#cv_website') || {}).value || '', seconds: Math.round((Date.now() - S.startedAt) / 1000), lang: LANG, roleKey: a.role, aiScore: cvAiScore(a), columns, values, cv: S.cv };
  btn.disabled = true; const label = btn.textContent; btn.textContent = L('جاري الإرسال…', 'Sending…');
  try {
    const res = await fetch(SHEET_URL, { method: 'POST', body: JSON.stringify(payload) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'server');
    LS.del(DRAFT); S.done = { ref: out.ref, name: String(a.fullName).trim().split(/\s+/)[0] }; S.keep = { fullName: a.fullName, phone: a.phone, email: a.email, city: a.city, linkedin: a.linkedin }; S.a = {}; S.cv = null; S.step = 0; S.max = 0; renderApp(); toTop();
  } catch (e) {
    btn.disabled = false; btn.textContent = label;
    showErrors([], L('ما قدرناش نبعت الطلب. اتأكد من الإنترنت وجرّب تاني، إجاباتك محفوظة.', 'We could not send your application. Check your connection and try again; your answers are saved.'));
  }
}

/* ---------- page ---------- */
function render() {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.title = L('الوظائف في RTU', 'Careers at RTU');
  const open = cvOpenRolesSA(), groups = ['tech', 'creative', 'business'].map(g => [g, open.filter(r => r.g === g)]).filter(x => x[1].length);
  const PROC = [[L('املا الطلب', 'Fill in the form'), L('حوالي ٢٠ دقيقة، وإجاباتك بتتحفظ على جهازك لو قفلت الصفحة.', 'About 20 minutes; answers save on your device if you close the page.')], [L('بنراجع طلبك', 'We review it'), L('بنقرا إجاباتك العملية بنفسنا، مش فلتر أوتوماتيك.', 'A person reads your practical answers, not an automatic filter.')], [L('مهمة عملية', 'Practical task'), L('مهمة قصيرة من شغلنا الحقيقي، تنفذها بأدوات الـ AI اللي تختارها.', 'A short task from real work, done with the AI tools you choose.')], [L('مقابلة', 'Interview'), L('نتكلم عن المهمة وطريقة شغلك، أونلاين أو في المقر.', 'We discuss the task and how you work, online or in person.')]];
  $('#hdr').innerHTML = `<div class="cv-wrap bar"><span class="brand"><span class="led"></span>RTU<small>READY TO USE</small></span><span class="sp"></span><a class="gbtn sm hide-sm" href="#roles">${L('الوظائف', 'Roles')}</a><a class="gbtn sm primary" href="#apply">${L('قدّم', 'Apply')}</a><button type="button" class="gbtn sm" id="lang">${LANG === 'ar' ? 'EN' : 'عربي'}</button></div>`;
  $('#lang').onclick = () => { LANG = LANG === 'ar' ? 'en' : 'ar'; LS.set('rtu_cv_lang', LANG); render(); };
  $('#main').innerHTML = `
  <section class="cv-hero"><div class="cv-wrap"><div class="g cv-hero-card" data-sheen>
    <div><span class="cv-eyebrow g sm"><span class="led"></span>${L('الوظائف في RTU', 'Careers at RTU')}</span>
      <h1>${L('اشتغل معانا.', 'Work with us.')}<br><span class="hl">${L('الـ AI أداتك الأولى.', 'AI is your first tool.')}</span></h1>
      <p class="lede">${L('في RTU كل خدمة بنقدمها، من الأنظمة للتصميم للفيديو، بتتنفذ بأدوات الذكاء الاصطناعي، والإنسان هو اللي بيوجّه ويراجع ويسلّم. لو بتعرف تطلّع من الـ AI شغل جاهز للتسليم، مكانك هنا.', 'At RTU every service, from systems to design to video, is built with AI tools, while people direct, review and deliver. If you can get client-ready work out of AI, you belong here.')}</p>
      <div class="cv-cta"><a class="gbtn primary" href="#apply">${L('قدّم دلوقتي', 'Apply now')}</a><a class="gbtn" href="#roles">${L('الوظائف المتاحة', 'Open roles')} (${fmtNum(open.length - 1)})</a></div></div>
    <div class="cv-facts">
      <div class="g sm cv-fact"><span>${L('طريقة الشغل', 'How we work')}</span><b>${L('AI أولًا، ومراجعة بشرية', 'AI first, human review')}</b></div>
      <div class="g sm cv-fact"><span>${L('أنواع التعاقد', 'Contract types')}</span><b>${L('دوام، جزئي، فريلانس، تدريب', 'Full, part-time, freelance, intern')}</b></div>
      <div class="g sm cv-fact"><span>${L('مكان الشغل', 'Location')}</span><b>${L('مقر، عن بُعد، هجين', 'On-site, remote, hybrid')}</b></div>
      <div class="g sm cv-fact"><span>${L('وقت التقديم', 'Time to apply')}</span><b>${L('٢٠ دقيقة تقريبًا', 'About 20 min')}</b></div></div></div></div></section>
  <section class="cv-sec"><div class="cv-wrap"><h2 class="cv-h2">${L('خطوات التوظيف', 'Hiring steps')}</h2><p class="cv-sub">${L('بنهتم بشغلك الحقيقي أكتر من الشهادات.', 'We care about your real work more than certificates.')}</p>
    <div class="cv-steps-row">${PROC.map((p, i) => `<div class="g sm cv-step"><span class="n">0${i + 1}</span><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join('')}</div></div></section>
  <section class="cv-sec" id="roles"><div class="cv-wrap"><h2 class="cv-h2">${L('الوظائف المتاحة', 'Open roles')}</h2><p class="cv-sub">${L('اختار وظيفة، والأسئلة العملية في الطلب هتتغير حسب تخصصها.', 'Pick a role; the practical questions adapt to it.')}</p>
    ${groups.length ? groups.map(([g, rs]) => `<div class="cv-group"><h3>${esc(L(CV_GROUPS[g][0], CV_GROUPS[g][1]))}</h3><div class="cv-roles">${rs.map(r => `<article class="g sm cv-role" data-sheen><h4>${esc(L(r.ar, r.en))}</h4><p>${esc(L(r.dAr, r.dEn))}</p><button type="button" class="gbtn sm ${S.a.role === r.k ? 'primary' : ''}" data-pick="${r.k}">${S.a.role === r.k ? L('اخترتها ✓', 'Selected ✓') : L('قدّم على الوظيفة دي', 'Apply for this role')}</button></article>`).join('')}</div></div>`).join('')
      : `<div class="g sm cv-closed">${L('مافيش وظايف مفتوحة حاليًا. تقدر تبعت تقديم عام.', 'No roles are open right now. You can send a general application.')}</div>`}
    <div class="g sm cv-general"><div><h4>${L('مش لاقي وظيفتك؟', 'Don\'t see your role?')}</h4><p>${L('قدّم تقديم عام وقولنا بتعرف تعمل إيه بالـ AI.', 'Send a general application and tell us what you can do with AI.')}</p></div><button type="button" class="gbtn sm ${S.a.role === 'general' ? 'primary' : ''}" data-pick="general">${S.a.role === 'general' ? L('اخترته ✓', 'Selected ✓') : L('تقديم عام', 'General application')}</button></div>
  </div></section>
  <section class="cv-sec" id="apply"><div class="cv-wrap"><div class="g cv-app" id="cvApp"></div></div></section>`;
  $('#ftr').innerHTML = `<div class="cv-wrap">© ${new Date().getFullYear()} RTU · Ready To Use</div>`;
  $$('[data-pick]').forEach(b => b.onclick = () => { S.a.role = b.dataset.pick; saveDraft(); render(); toTop(); });
  $$('[data-sheen]').forEach(el => el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); el.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%'); el.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%'); }));
  renderApp();
}
loadDraft(); render();

</script>
</body>
